<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق متابعة العمال</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    /* منع تحديد النص أثناء الضغط المطول */
    .no-select {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 pb-20">

  <div class="max-w-md mx-auto space-y-6">
    
    <!-- Auth Section -->
    <div id="authSection" class="bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-4">
      <h2 class="text-xl font-bold text-center text-blue-400">تسجيل الدخول / إنشاء حساب</h2>
      <input type="tel" id="phoneInput" placeholder="رقم الهاتف (مثال: 0612345678)" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500">
      <input type="password" id="passwordInput" placeholder="كلمة المرور" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500">
      <div class="flex gap-2">
        <button onclick="login()" class="w-1/2 py-3 bg-blue-600 font-bold rounded-xl hover:bg-blue-500 transition">دخول</button>
        <button onclick="register()" class="w-1/2 py-3 bg-slate-800 font-bold rounded-xl hover:bg-slate-700 transition">حساب جديد</button>
      </div>
    </div>

    <!-- App Main Section -->
    <div id="appSection" class="hidden space-y-6">
      
      <!-- User Header -->
      <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
        <div>
          <p class="text-xs text-slate-400">مرحباً بك</p>
          <p id="userPhoneDisplay" class="font-bold text-blue-400 text-sm"></p>
        </div>
        <button onclick="logout()" class="text-xs bg-red-500/10 text-red-400 px-3 py-1.5 rounded-lg border border-red-500/20">خروج</button>
      </div>

      <!-- Add Worker Form -->
      <div class="bg-slate-900 p-5 rounded-3xl border border-slate-800 space-y-3">
        <h3 class="font-bold text-sm text-slate-300">➕ إضافة عامل جديد</h3>
        <input type="text" id="workerName" placeholder="اسم العامل" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white">
        
        <div class="flex items-center gap-3">
          <input type="file" id="workerPhoto" accept="image/*" class="hidden" onchange="previewImage(event)">
          <label for="workerPhoto" class="cursor-pointer bg-slate-800 hover:bg-slate-700 px-4 py-2.5 rounded-xl text-xs font-bold text-slate-300 border border-slate-700">
            📸 اختيار صورة
          </label>
          <span id="fileName" class="text-xs text-slate-500">لم يتم اختيار صورة</span>
        </div>

        <button onclick="addWorker()" class="w-full py-3 bg-emerald-600 font-bold rounded-xl hover:bg-emerald-500 transition text-sm">حفظ العامل</button>
      </div>

      <!-- شريط الحذف المتعدد (يظهر فقط عند التحديد) -->
      <div id="bulkDeleteBar" class="hidden bg-red-950/80 border border-red-800 p-3 rounded-2xl flex justify-between items-center animate-pulse">
        <span id="selectedCountText" class="text-xs font-bold text-red-200">تم تحديد 0 أيام</span>
        <div class="flex gap-2">
          <button onclick="cancelSelection()" class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-xl">إلغاء</button>
          <button onclick="deleteSelectedLogs()" class="text-xs bg-red-600 hover:bg-red-500 text-white font-bold px-3 py-1.5 rounded-xl shadow">حذف المحدد 🗑️</button>
        </div>
      </div>

      <!-- Workers List -->
      <div class="space-y-3">
        <h3 class="font-bold text-slate-300 text-sm">👷 قائمة العمال واليوميات</h3>
        <div id="workersList" class="space-y-3">
          <!-- كيتزادوا العمال والسجلات هنا -->
        </div>
      </div>

    </div>

  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBU-gtVFbI7QEGsZxnESkShv4DlV81o3NQ",
      authDomain: "workerapp-30908.firebaseapp.com",
      projectId: "workerapp-30908",
      storageBucket: "workerapp-30908.firebasestorage.app",
      messagingSenderId: "211170585199",
      appId: "1:211170585199:web:c96dd78e16a914c5a5fb9a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let base64Image = "";
    let isSelectionMode = false;
    let selectedLogIds = new Set();
    let pressTimer = null;

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('userPhoneDisplay').innerText = user.email.replace('@app.com', '');
        loadWorkers();
      } else {
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('appSection').classList.add('hidden');
      }
    });

    window.login = async () => {
      const phone = document.getElementById('phoneInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      if (!phone || !pass) return alert("عمر جميع الخانات!");
      try { await signInWithEmailAndPassword(auth, `${phone}@app.com`, pass); } 
      catch (e) { alert("خطأ فـ الدخول: " + e.message); }
    };

    window.register = async () => {
      const phone = document.getElementById('phoneInput').value.trim();
      const pass = document.getElementById('passwordInput').value.trim();
      if (!phone || !pass) return alert("عمر جميع الخانات!");
      try { await createUserWithEmailAndPassword(auth, `${phone}@app.com`, pass); } 
      catch (e) { alert("خطأ فـ التسجيل: " + e.message); }
    };

    window.logout = () => signOut(auth);

    window.previewImage = (e) => {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('fileName').innerText = file.name;
        const reader = new FileReader();
        reader.onloadend = () => { base64Image = reader.result; };
        reader.readAsDataURL(file);
      }
    };

    window.addWorker = async () => {
      const name = document.getElementById('workerName').value.trim();
      if (!name) return alert("كتب سمية العامل!");
      try {
        await addDoc(collection(db, "workers"), {
          name: name,
          avatar: base64Image,
          ownerId: currentUser.uid,
          createdAt: new Date()
        });
        document.getElementById('workerName').value = "";
        document.getElementById('fileName').innerText = "لم يتم اختيار صورة";
        base64Image = "";
      } catch (e) { alert("خطأ: " + e.message); }
    };

    // جلب العمال والسجلات
    function loadWorkers() {
      const qWorkers = query(collection(db, "workers"), where("ownerId", "==", currentUser.uid));
      
      onSnapshot(qWorkers, (snapshotWorkers) => {
        const list = document.getElementById('workersList');
        list.innerHTML = "";

        snapshotWorkers.forEach((workerDoc) => {
          const w = workerDoc.data();
          const workerId = workerDoc.id;

          const avatar = w.avatar 
            ? `<img src="${w.avatar}" class="w-10 h-10 rounded-full object-cover">` 
            : `<div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center font-bold">${w.name.charAt(0)}</div>`;

          const workerCard = document.createElement('div');
          workerCard.className = "bg-slate-900 p-4 rounded-2xl border border-slate-800 space-y-3";
          workerCard.innerHTML = `
            <div class="flex justify-between items-center border-b border-slate-800/80 pb-3">
              <div class="flex items-center gap-3">
                ${avatar}
                <h4 class="font-bold text-sm text-white">${w.name}</h4>
              </div>
            </div>
            <div id="logs-${workerId}" class="space-y-2">
              <p class="text-xs text-slate-500">جاري تحميل الأيام...</p>
            </div>
          `;
          list.appendChild(workerCard);

          // جلب يوميات وسجلات هاد العامل
          const qLogs = query(collection(db, "logs"), where("workerId", "==", workerId));
          onSnapshot(qLogs, (snapshotLogs) => {
            const logsContainer = document.getElementById(`logs-${workerId}`);
            logsContainer.innerHTML = "";

            if (snapshotLogs.empty) {
              logsContainer.innerHTML = `<p class="text-xs text-slate-600">لا توجد أيّام مسجلة بعد</p>`;
              return;
            }

            snapshotLogs.forEach((logDoc) => {
              const log = logDoc.data();
              const logId = logDoc.id;
              
              const logItem = document.createElement('div');
              logItem.id = `log-item-${logId}`;
              logItem.className = "no-select flex justify-between items-center bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs transition cursor-pointer";
              
              // أحداث الضغط المطول (Long Press)
              logItem.addEventListener('touchstart', () => startPress(logId));
              logItem.addEventListener('touchend', () => cancelPress());
              logItem.addEventListener('mousedown', () => startPress(logId));
              logItem.addEventListener('mouseup', () => cancelPress());
              logItem.addEventListener('mouseleave', () => cancelPress());

              logItem.onclick = () => {
                if (isSelectionMode) {
                  toggleSelectLog(logId);
                }
              };

              const isChecked = selectedLogIds.has(logId);
              const checkboxHTML = isSelectionMode 
                ? `<input type="checkbox" ${isChecked ? 'checked' : ''} class="w-4 h-4 accent-red-500 pointer-events-none">` 
                : '';

              logItem.innerHTML = `
                <div class="flex items-center gap-2">
                  ${checkboxHTML}
                  <div>
                    <span class="font-bold ${log.status === 'اشتغل' ? 'text-emerald-400' : 'text-slate-400'}">${log.status || 'يوم'}</span>
                    <span class="text-slate-500 text-[10px] block">${log.date || ''}</span>
                  </div>
                </div>
                <span class="text-amber-400 font-bold">${log.advance ? log.advance + ' درهم' : ''}</span>
              `;

              logsContainer.appendChild(logItem);
            });
          });
        });
      });
    }

    // إدارة الضغط المطول والتحديد
    function startPress(logId) {
      pressTimer = setTimeout(() => {
        if (!isSelectionMode) {
          isSelectionMode = true;
          toggleSelectLog(logId);
          // اهتزاز خفيف للهاتف عند نجاح الضغط المطول (فالأجهزة الداعمة)
          if (navigator.vibrate) navigator.vibrate(50);
        }
      }, 600); // 600 ملي ثانية للضغط المطول
    }

    function cancelPress() {
      clearTimeout(pressTimer);
    }

    function toggleSelectLog(logId) {
      if (selectedLogIds.has(logId)) {
        selectedLogIds.delete(logId);
      } else {
        selectedLogIds.add(logId);
      }

      if (selectedLogIds.size === 0) {
        cancelSelection();
      } else {
        updateUIForSelection();
      }
    }

    function updateUIForSelection() {
      const bar = document.getElementById('bulkDeleteBar');
      bar.classList.remove('hidden');
      document.getElementById('selectedCountText').innerText = `تم تحديد ${selectedLogIds.size} أيام`;
      loadWorkers(); // إعادة تحديث الخانات المحددة
    }

    window.cancelSelection = () => {
      isSelectionMode = false;
      selectedLogIds.clear();
      document.getElementById('bulkDeleteBar').classList.add('hidden');
      loadWorkers();
    };

    // حذف جميع الأيام المحددة
    window.deleteSelectedLogs = async () => {
      if (selectedLogIds.size === 0) return;
      
      if (confirm(`واش متأكد بغيتي تحذف ${selectedLogIds.size} أيام دفعة واحدة؟`)) {
        try {
          const deletePromises = Array.from(selectedLogIds).map(id => deleteDoc(doc(db, "logs", id)));
          await Promise.all(deletePromises);
          alert("تم حذف الأيام المحددة بنجاح!");
          cancelSelection();
        } catch (e) {
          alert("حدث خطأ أثناء الحذف: " + e.message);
        }
      }
    };
  </script>
</body>
</html>
